<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff6e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anachro">
  <meta name="description" content="Anachro : trouve l'objet qui n'a rien à faire là, dans des scènes d'époque. Prototype jouable.">
  <title>Anachro</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="phone">
    <section class="screen" id="screen-home" aria-label="Accueil"></section>
    <section class="screen" id="screen-era" aria-label="Époque"></section>
    <section class="screen" id="screen-ranking" aria-label="Classement"></section>
    <section class="screen" id="screen-profile" aria-label="Profil"></section>

    <section class="screen game" id="screen-game" aria-label="Partie">
      <div class="stage" id="stage">
        <div class="scene" id="scene" role="application" aria-label="Scène : touche l'objet qui n'appartient pas à l'époque">
          <div class="scene-inner" id="sceneInner"></div>
        </div>
      </div>
      <div class="hud hud-top" id="hudTop"></div>
      <div class="mascot-corner" id="mascotCorner" aria-hidden="true"></div>
      <div class="hud hud-bottom" id="hudBottom"></div>
      <div class="overlay" id="overlay" hidden></div>
    </section>

    <nav class="tabbar" id="tabbar" aria-label="Navigation">
      <button class="tab active" data-tab="home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Accueil</span></button>
      <button class="tab" data-tab="ranking"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9.5 18h5"/></svg><span>Classement</span></button>
      <button class="tab" data-tab="profile"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>Profil</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="js/levels.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
